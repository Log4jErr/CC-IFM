<!DOCTYPE html>
<html lang="zh-CN" data-ifm-build="487">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>IFM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="web/ifm.css?v=487">
</head>
<body>
<div id="loginOverlay">
    <div class="login-box">
        <h1><i class="fa fa-industry"></i> IFM</h1>
        <p data-i18n="loginHint">loginHint</p>
        <input id="roomInput" type="text" placeholder="room name" autocomplete="off">
        <input id="relayInput" type="text" placeholder="wss://itty.ws/c/" autocomplete="off">
        <button class="btn-pixel primary" id="connectBtn" style="width:100%;justify-content:center">
            <i class="fa fa-plug"></i> <span data-i18n="connect">connect</span>
        </button>
        <a class="btn-pixel help-btn" id="helpBtn" href="https://github.com/Log4jErr/CC-IFM"
           target="_blank" rel="noopener noreferrer" data-i18n-title="helpHint">
            <i class="fa fa-circle-question"></i> <span data-i18n="help">help</span>
        </a>
        <button class="btn-pixel help-btn" id="loginLangBtn" type="button" data-i18n-title="langTitle">
            <i class="fa fa-language"></i> <span id="loginLangLabel" data-i18n="langLabel">langLabel</span>
        </button>
        <p class="muted" style="margin-top:10px" data-i18n="relayHint">relayHint</p>
        <p class="muted mt-2" id="loginError"></p>
        <p class="muted" id="versionHint"></p>
    </div>
</div>

<div id="app">
    <header class="app-header">
        <button class="btn-pixel nav-toggle" id="navToggle" type="button"><i class="fa fa-industry"></i> IFM</button>
        <h1><i class="fa fa-industry"></i> IFM</h1>
        <span><span id="statusDot" class="status-dot"></span><span id="statusText"></span></span>
        <span class="muted" id="roomLabel"></span>
        <span class="muted" id="relayLabel"></span>
        <span class="muted" id="versionLabel"></span>
        <span class="muted" id="tagInfo"></span>
        <span class="muted" id="transferInfo"></span>
        <span class="muted" id="dispatchInfo"></span>
        <span class="muted" id="pendingInfo"></span>
        <span class="header-spacer"></span>
        <button class="btn-pixel" id="diagnoseBtn" data-i18n-title="diagnoseTitle" title="diagnoseTitle"><i class="fa fa-stethoscope"></i></button>
        <button class="btn-pixel" id="langBtn" data-i18n-title="langTitle" title="langTitle"><i class="fa fa-language"></i> <span id="langLabel" data-i18n="langLabel">langLabel</span></button>
        <button class="btn-pixel" id="translateBtn" data-i18n-title="translateTitle" title="translateTitle"><i class="fa fa-translate"></i> <span id="translateLabel"></span></button>
        <button class="btn-pixel danger" id="disconnectBtn" data-i18n-title="disconnect" title="disconnect"><i class="fa fa-power-off"></i></button>
    </header>

    <div class="app-body">
        <nav id="panelNav" class="panel-nav">
            <button class="btn-pixel nav-item" type="button" data-panel="processes"><i class="fa fa-tasks"></i> <span data-i18n="processes">processes</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="graph"><i class="fa fa-sitemap"></i> <span data-i18n="graph">graph</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="resources"><i class="fa fa-th"></i> <span data-i18n="resources">resources</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="workers"><i class="fa fa-server"></i> <span data-i18n="workerPanel">workerPanel</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="peripherals"><i class="fa fa-microchip"></i> <span data-i18n="peripherals">peripherals</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="filter"><i class="fa fa-filter"></i> <span data-i18n="filter">filter</span></button>
            <button class="btn-pixel nav-item" type="button" data-panel="settings"><i class="fa fa-sliders"></i> <span data-i18n="settingsTitle">settingsTitle</span></button>
        </nav>
        <main id="panelPages" class="panel-pages">
        <section class="panel" data-panel-page="processes">
            <header>
                <h2><i class="fa fa-tasks"></i> <span data-i18n="processes">processes</span></h2>
            </header>
            <div id="processList"></div>
        </section>

        <section class="panel" data-panel-page="graph">
            <header>
                <h2><i class="fa fa-sitemap"></i> <span data-i18n="graph">graph</span></h2>
                <span class="spacer"></span>
            </header>
            <div id="graph"></div>
        </section>

        <section class="panel" data-panel-page="resources">
            <header>
                <h2><i class="fa fa-th"></i> <span data-i18n="resources">resources</span></h2>
                <span class="spacer"></span>
            </header>
            <div id="resourceGrid" class="resource-grid"></div>
        </section>


        <section class="panel" data-panel-page="workers">
            <header>
                <h2><i class="fa fa-server"></i> <span data-i18n="workerPanel">workerPanel</span></h2>
                <span class="spacer"></span>
                <span class="muted" id="workerHint"></span>
                <span class="worker-load-wrap">
                    <span class="progress worker-load total" id="workerLoadBar"><span class="bar"></span></span>
                    <span class="muted" id="workerLoadText"></span>
                </span>
            </header>
            <div id="workerList"></div>
        </section>

        <section class="panel peripheral-panel" data-panel-page="peripherals">
            <header>
                <h2><i class="fa fa-microchip"></i> <span data-i18n="peripherals">peripherals</span></h2>
                <span class="spacer"></span>
                <span class="muted" id="peripheralSelHint"></span>
            </header>
            <div id="missingList" class="peripheral-section"></div>
            <div id="machineTypeList" class="machine-type-list"></div>
            <div id="storageList" class="machine-type-list"></div>
            <div id="inputList" class="machine-type-list"></div>
            <div id="outputList" class="machine-type-list"></div>
            <div id="peripheralList"></div>
        </section>

        <section class="panel" data-panel-page="filter">
            <header>
                <h2><i class="fa fa-filter"></i> <span data-i18n="filter">filter</span></h2>
                <span class="spacer"></span>
                <button class="btn-pixel" id="addFilterBtn"><i class="fa fa-plus"></i> <span data-i18n="filter">filter</span></button>
            </header>
            <div id="filterList" class="chip-list"></div>
        </section>

        <section class="panel" data-panel-page="settings">
            <header>
                <h2><i class="fa fa-sliders"></i> <span data-i18n="settingsTitle">settingsTitle</span></h2>
                <span class="spacer"></span>
            </header>
            <div id="settingsBody"></div>
            <input type="file" id="dataFileInput" accept=".json,application/json" style="display:none">
        </section>
        </main>
    <section class="panel" id="deliveryPanel">
        <header>
            <h2><i class="fa fa-send"></i> <span data-i18n="send">send</span></h2>
            <span class="spacer"></span>
            <select id="sendContainer" data-i18n-title="sendContainerHint" title="sendContainerHint"></select>
            <button class="btn-pixel primary" id="sendBtn"><i class="fa fa-paper-plane"></i> <span data-i18n="send">send</span></button>
        </header>
        <div class="delivery-columns">
            <div class="delivery-column">
                <div class="delivery-head"><i class="fa fa-hourglass-half"></i> <span data-i18n="sendList">sendList</span>
                    <button class="btn-pixel danger delivery-clear" id="clearSendBtn" type="button" data-i18n-title="clearSendTitle" title="clearSendTitle"><i class="fa fa-trash"></i></button>
                </div>
                <div id="sendGrid" class="resource-grid"></div>
            </div>
            <div class="delivery-column">
                <div class="delivery-head"><i class="fa fa-truck"></i> <span data-i18n="deliveries">deliveries</span>
                    <button class="btn-pixel danger delivery-clear" id="clearDeliveriesBtn" type="button"><i class="fa fa-trash"></i></button>
                </div>
                <div id="deliveryGrid" class="resource-grid"></div>
            </div>
        </div>
    </section>
    </div>
    <div id="navBackdrop" class="nav-backdrop"></div>
</div>

<div class="modal fade" id="editorModal" tabindex="-1" data-bs-focus="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editorTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="editorBody"></div>
            <div class="modal-footer">
                <button class="btn-pixel danger" id="editorDeleteBtn"><i class="fa fa-trash"></i> <span data-i18n="delete">delete</span></button>
                <span style="flex:1"></span>
                <button class="btn-pixel" data-bs-dismiss="modal"><i class="fa fa-times"></i> <span data-i18n="cancel">cancel</span></button>
                <button class="btn-pixel primary" id="editorSaveBtn"><i class="fa fa-check"></i> <span data-i18n="save">save</span></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="promptModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="promptTitle"></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="editor-row"><label id="promptLabel"></label><input type="text" id="promptInput" inputmode="numeric" autocomplete="off" style="width:100%"></div>
                <select id="promptSelect" style="display:none;width:100%"></select>
                <div class="muted" id="promptPreview"></div>
                <p class="muted" id="promptHint"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-pixel" data-bs-dismiss="modal"><i class="fa fa-times"></i> <span data-i18n="cancel">cancel</span></button>
                <button class="btn-pixel primary" id="promptConfirmBtn"><i class="fa fa-check"></i> <span data-i18n="ok">ok</span></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="stockModal" tabindex="-1" data-bs-focus="false">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa fa-box-open"></i> <span data-i18n="pickResourceTitle">pickResourceTitle</span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <span class="search-wrap" style="margin-bottom:10px">
                    <input type="text" id="stockSearch" placeholder="search" title="searchSyntax">
                    <button class="btn-pixel search-clear" id="stockSearchClear" type="button" data-i18n-title="searchClear" style="display:none" title="searchClear"><i class="fa fa-times"></i></button>
                </span>
                <div id="stockList" class="stock-list"></div>
            </div>
            <div class="modal-footer">
                <span class="muted" id="stockHint" style="margin-right:auto"></span>
                <button class="btn-pixel" data-bs-dismiss="modal"><i class="fa fa-times"></i> <span data-i18n="cancel">cancel</span></button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="diagnoseModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fa fa-stethoscope"></i> <span data-i18n="diagnoseBtn">diagnoseBtn</span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="diagnoseOutput" style="white-space:pre-wrap;word-break:break-all;margin:0;font-size:12px"></pre>
            </div>
            <div class="modal-footer">
                <span class="muted" id="diagnoseHint" style="margin-right:auto"></span>
                <button class="btn-pixel" type="button" onclick="window.ifmDiagnose('report')"><i class="fa fa-refresh"></i> report</button>
                <button class="btn-pixel" type="button" onclick="window.ifmDiagnose('tick')"><i class="fa fa-step-forward"></i> tick</button>
                <button class="btn-pixel danger" type="button" onclick="window.ifmDiagnose('move')"><i class="fa fa-exchange"></i> move</button>
                <button class="btn-pixel" type="button" onclick="window.ifmDiagnose('perf')"><i class="fa fa-clock-o"></i> perf</button>
                <button class="btn-pixel primary" data-bs-dismiss="modal"><i class="fa fa-check"></i> <span data-i18n="ok">ok</span></button>
            </div>
        </div>
    </div>
</div>

<div id="searchToolbar" class="search-toolbar" style="display:none">
    <span class="search-group" data-search-panel="processes" hidden>
        <span class="search-wrap">
            <input type="text" id="processSearch" placeholder="search" autocomplete="off" title="searchSyntax">
            <button class="btn-pixel search-clear" id="processSearchClear" type="button" data-i18n-title="searchClear" style="display:none" title="searchClear"><i class="fa fa-times"></i></button>
        </span>
    </span>
    <span class="search-group" data-search-panel="graph" hidden>
        <span class="search-wrap">
            <input type="text" id="graphSearch" placeholder="search" autocomplete="off" title="searchSyntax">
            <button class="btn-pixel search-clear" id="graphSearchClear" type="button" data-i18n-title="searchClear" style="display:none" title="searchClear"><i class="fa fa-times"></i></button>
        </span>
        <button class="btn-pixel" id="graphLayoutBtn" data-i18n-title="graphLayoutTitle" title="graphLayoutTitle"><i class="fa fa-random"></i> <span id="graphLayoutLabel"></span></button>
        <button class="btn-pixel" id="graphSvgBtn" data-i18n-title="graphDownloadSvg" title="graphDownloadSvg"><i class="fa fa-download"></i></button>
        <button class="btn-pixel primary" id="addProcessBtn"><i class="fa fa-plus"></i> <span data-i18n="addProcess">addProcess</span></button>
    </span>
    <span class="search-group" data-search-panel="resources" hidden>
        <span class="search-wrap">
            <input type="text" id="resourceSearch" placeholder="search" autocomplete="off" title="searchSyntax">
            <button class="btn-pixel search-clear" id="resourceSearchClear" type="button" data-i18n-title="searchClear" style="display:none" title="searchClear"><i class="fa fa-times"></i></button>
        </span>
        <button class="btn-pixel" id="resourceSortBtn" data-i18n-title="sortTitle" title="sortTitle"><i class="fa fa-sort-alpha-asc"></i></button>
        <div class="capacity-box" id="capacityBars"></div>
        <div class="capacity-box" id="compactProgress" style="display:none"></div>
    </span>
    <span class="search-group" data-search-panel="peripherals" hidden>
        <span class="search-wrap">
            <input type="text" id="peripheralSearch" placeholder="search" autocomplete="off" title="searchSyntax">
            <button class="btn-pixel search-clear" id="peripheralSearchClear" type="button" data-i18n-title="searchClear" style="display:none" title="searchClear"><i class="fa fa-times"></i></button>
        </span>
        <button class="btn-pixel" id="peripheralSortBtn" data-i18n-title="peripheralSortTitle" title="peripheralSortTitle"><i class="fa fa-sort-alpha-asc"></i> <span id="peripheralSortLabel">sortPeripheralPeripheral</span></button>
        <button class="btn-pixel" id="addMachineTypeBtn"><i class="fa fa-plus"></i> <span data-i18n="machineType">machineType</span></button>
    </span>
</div>

<div id="toastArea"></div>
<div id="selectMarquee"></div>

<script src="web/ifm-translate.js?v=487"></script>
<script charset="UTF-8" src="dist/pinyinlite_full.min.js"></script>

<script src="web/ifm-messages.js?v=487"></script>
<script src="web/ifm-core.js?v=487"></script>
<script src="web/ifm-meta.js?v=487"></script>
<script src="web/ifm-net.js?v=487"></script>
<script src="web/ifm-resources.js?v=487"></script>
<script src="web/ifm-processes.js?v=487"></script>
    <script src="web/ifm-panels.js?v=487"></script>
<script src="web/ifm-editor.js?v=487"></script>
<script src="web/ifm-picker.js?v=487"></script>
<script src="web/ifm-workers.js?v=487"></script>
<script src="web/ifm-app.js?v=487"></script>
<script>
window.setTimeout(function () {
    if (typeof window.ifmServerLog === 'function') return;
    var node = document.getElementById('loginError');
    if (node && !node.textContent) {
        node.textContent = 'IFM scripts did not load - deploy the whole web/ folder next to index.html ' +
            '(open the browser console / network tab for 404s)';
    }
}, 2000);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@12/dist/mermaid.min.js"></script>
</body>
</html>
